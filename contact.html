<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Wedding Planner</title>
    <link rel="stylesheet" href="contact.css"> <!-- Linking CSS -->
    <script defer src="contact.js"></script> <!-- Linking JS -->
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li><a href="page1.html">Home</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <!-- Contact Section -->
    <section class="contact">
        <h1>Contact Us</h1>
        <p>Have questions or need more details? Fill out the form below, and we'll get back to you soon.</p>

        <form id="contactForm">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>

            <button type="submit">Send Message</button>
        </form>

        <p id="successMessage" class="hidden">✅ Thank you! Your message has been sent.</p>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Wedding Planner | Designed by Krupa Gowda</p>
    </footer>

</body>
</html>
